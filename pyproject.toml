[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "efficient-polling-lr-scheduler"
dynamic = ["version"]
description = "Polling-based learning-rate selection for PyTorch: the accuracy of per-batch LR polling at roughly the cost of plain SGD."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Luiz Henrique", email = "luizlinkezio@gmail.com" },
    { name = "José Ronaldo" },
]
keywords = [
    "pytorch",
    "deep-learning",
    "optimizer",
    "learning-rate",
    "learning-rate-schedule",
    "hyperparameter-optimization",
    "polling",
    "sgd",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
examples = ["numpy>=1.24", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/luiz-linkezio/Efficient-Polling-Based-Learning-Rate-Optimization-for-Neural-Networks"
Repository = "https://github.com/luiz-linkezio/Efficient-Polling-Based-Learning-Rate-Optimization-for-Neural-Networks"
Issues = "https://github.com/luiz-linkezio/Efficient-Polling-Based-Learning-Rate-Optimization-for-Neural-Networks/issues"
Changelog = "https://github.com/luiz-linkezio/Efficient-Polling-Based-Learning-Rate-Optimization-for-Neural-Networks/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/efficient_polling_lr_scheduler/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/efficient_polling_lr_scheduler"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The notebook is the original research artifact; it is not held to package style.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
